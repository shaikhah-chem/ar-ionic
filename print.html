<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طباعة بطاقات الواقع المعزز</title>
<style>
  @font-face { font-family: Cairo; font-weight: 700; src: url(fonts/cairo-arabic-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Cairo; font-weight: 900; src: url(fonts/cairo-arabic-900-normal.woff2) format('woff2'); }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Cairo, sans-serif; background: #e2e8f0; color: #0f172a; }
  .bar { position: sticky; top: 0; background: #0b1220; color: #fff; padding: 14px 18px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; z-index: 2; }
  .bar p { font-weight: 700; font-size: 15px; line-height: 1.6; }
  .bar button { font-family: inherit; font-weight: 900; font-size: 17px; padding: 10px 22px; border-radius: 14px; border: 0; background: #22d3ee; color: #06202a; cursor: pointer; }
  .page { width: 210mm; height: 297mm; position: relative; margin: 16px auto; background: #fff; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6mm; page-break-after: always; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .cut { position: relative; padding: 4mm; border: 0.3mm dashed #94a3b8; }
  .cut img { display: block; width: 150mm; height: 200mm; }
  .tip { font-size: 11pt; font-weight: 700; color: #475569; }
  @media print { body { background: #fff; } .bar { display: none; } .page { margin: 0; box-shadow: none; } }
  @media screen and (max-width: 800px) { .page { transform: scale(.45); transform-origin: top center; margin-bottom: -150mm; } }
</style>
  <script>
    /* حماية المحتوى: منع النقر الأيمن والنسخ واختصارات عرض المصدر */
    (function () {
      var stop = function (e) { e.preventDefault(); return false; };
      ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach(function (t) { document.addEventListener(t, stop); });
      document.addEventListener('keydown', function (e) {
        var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
        if (e.key === 'F12' || (c && ['u', 's', 'c', 'a'].indexOf(k) > -1) || (c && e.shiftKey && ['i', 'j', 'c', 'k'].indexOf(k) > -1) || (e.metaKey && e.altKey && ['i', 'j', 'c', 'u'].indexOf(k) > -1)) stop(e);
      });
    })();
  </script>
  <style>html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}img{-webkit-user-drag:none;pointer-events:none}</style>
</head>
<body>
  <div class="bar">
    <p>اطبعي بالألوان على ورق A4 وبحجم 100% (بدون «ملاءمة الصفحة»). يُفضّل ورق مقوّى غير لامع.</p>
    <button onclick="print()">🖨️ طباعة</button>
  </div>
  <section class="page"><div class="cut"><img src="cards/card-mgcl2.png" alt="بطاقة كلوريد المغنيسيوم"></div><p class="tip">✂ قصّي على الخط المتقطع · بطاقة 1: كلوريد المغنيسيوم</p></section>
  <section class="page"><div class="cut"><img src="cards/card-al2o3.png" alt="بطاقة أكسيد الألومنيوم"></div><p class="tip">✂ قصّي على الخط المتقطع · بطاقة 2: أكسيد الألومنيوم</p></section>
  <section class="page"><div class="cut"><img src="cards/card-caoh2.png" alt="بطاقة هيدروكسيد الكالسيوم"></div><p class="tip">✂ قصّي على الخط المتقطع · بطاقة 3: هيدروكسيد الكالسيوم</p></section>
<p style="position:fixed;left:10px;bottom:6px;font-size:10px;color:#94a3b8">تنفيذ المعلمة: أ. شيخه المطيري</p>
</body>
</html>
